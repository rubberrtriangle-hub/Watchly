<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente del fondo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff4b"/>
      <stop offset="100%" stop-color="#d9ff4b"/>
    </linearGradient>
    
    <!-- Gradiente de la W -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#"/>
      <stop offset="100%" stop-color="#"/>
    </linearGradient>
    
    <!-- Efecto de sombra para dar profundidad -->
    <!--<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>-->
  </defs>
  
  <!-- Rectángulo de fondo redondeado -->
  <rect x="26" y="26" width="460" height="460" rx="100" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Trazado de la letra W -->
  <path d="M130 170 L200 350 L256 240 L312 350 L382 170" 
        fill="none" 
        stroke="url(#wGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>
</svg>
