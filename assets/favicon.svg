<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente del fondo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff4b"/>
      <stop offset="100%" stop-color="#d9ff4b"/>
    </linearGradient>
    
    <!-- Gradiente de la W -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  
  <!-- Rectángulo de fondo redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Trazado de la letra W (Tamaño intermedio ajustado) -->
  <path d="M105 150 L190 370 L256 245 L322 370 L407 150" 
        fill="none" 
        stroke="url(#wGrad)" 
        stroke-width="65" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
